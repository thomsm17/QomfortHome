kind = "web"
previewPath = "/"
title = "QomfortHome"
description = "Een Nederlandstalige website voor QomfortHome, met informatie over verduurzamingsadvies en installatie van warmtepompen, airco's, hybride systemen en thuisbatterijen."
version = "1.0.0"
id = "artifacts/qomforthome"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20758

[services.development]
run = "pnpm --filter @workspace/qomforthome run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/qomforthome", "run", "build" ]
serve = "static"
publicDir = "artifacts/qomforthome/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20758"
BASE_PATH = "/"
