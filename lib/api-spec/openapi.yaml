openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Contact requests
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact-requests:
    post:
      operationId: submitContactRequest
      tags: [contact]
      summary: Send a contact request to QomfortHome
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequestInput"
      responses:
        "202":
          description: Contact request accepted and email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRequestAccepted"
        "400":
          description: Invalid form data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Email delivery failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContactRequestInput:
      type: object
      required: [name, email, topic, message]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 40
        topic:
          type: string
          enum: [warmtepomp, airco, hybride, thuisbatterij, advies]
        message:
          type: string
          minLength: 10
          maxLength: 4000
        website:
          type: string
          maxLength: 200
    ContactRequestAccepted:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [sent]
        message:
          type: string
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

